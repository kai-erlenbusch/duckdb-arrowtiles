[package]
name = "arrowtiles-engine"
version = "0.1.0"
edition = "2021"
description = "Embedded Zero-Copy DuckLake Engine"

[dependencies]
arrow = { version = "58.0.0" }
fast_hilbert = "2.1.0"
dashmap = "5.5.3"
lazy_static = "1.4.0"
parquet = "58.0.0"
pmtiles = { version = "0.23.0", features = ["write", "zstd"] }
ahash = "0.8.11"
indicatif = "0.17.8"
serde_json = "1.0"
base64 = "0.22"
rayon = "1.10"
glob = "0.3.1"

[[bin]]
name = "arrowtiles_engine"
path = "src/bin/arrowtiles_engine.rs"
